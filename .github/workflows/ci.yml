name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & build client
        run: npm run build
      - name: Sanity-check server boots (no DB required for this check)
        run: node -e "require('./server/db/database.js'); console.log('server module loads OK')"
